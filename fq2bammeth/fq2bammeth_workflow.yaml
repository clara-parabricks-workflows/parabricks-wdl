fq2bammeth_workflow:
  - name: single-ended
    inputs:
      reads:
        - [data/fq2bammeth_sample.fastq.gz]
      fasta:
        - ref/fq2bammeth_ref.fa
      output_fmt:
        - "bam"
      single_ended:
        - true
      prefix:
        - "test"
      memory:
        - 30
      num_gpus:
        - 1
      num_cpus:
        - 8
      container:
        - "nvcr.io/nvidia/clara/clara-parabricks:4.7.0-1"